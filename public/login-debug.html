<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ログイン (DEBUG) - WEB CHECKER</title>
    <link type="text/css" rel="stylesheet" href="https://www.gstatic.com/firebasejs/ui/6.1.0/firebase-ui-auth.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <style>
      #debug-log {
        background: #1e1e1e;
        color: #0f0;
        padding: 15px;
        border-radius: 5px;
        font-family: monospace;
        font-size: 12px;
        max-height: 400px;
        overflow-y: auto;
        white-space: pre-wrap;
        word-break: break-all;
      }
      #debug-log .error { color: #f66; }
      #debug-log .warn { color: #ff0; }
      #debug-log .info { color: #6cf; }
      #debug-log .success { color: #6f6; }
    </style>
  </head>

  <body>
    <div class="container mt-5">
      <h1>WEB CHECKER <span class="badge badge-warning">DEBUG MODE</span></h1>
      <p class="text-muted">Web ページの変更を監視して Slack に通知します</p>
      <hr>

      <div class="row">
        <div class="col-md-6">
          <h2>ログイン</h2>
          <div id="firebaseui-auth-container"></div>

          <div id="error-display" class="alert alert-danger mt-3" style="display: none;">
            <strong>認証エラー:</strong>
            <pre id="error-message" style="margin: 0; white-space: pre-wrap;"></pre>
          </div>
        </div>

        <div class="col-md-6">
          <h2>Debug Log</h2>
          <div id="debug-log"></div>
          <button class="btn btn-sm btn-secondary mt-2" onclick="clearDebugLog()">Clear Log</button>
          <button class="btn btn-sm btn-info mt-2" onclick="checkAuthState()">Check Auth State</button>
        </div>
      </div>

      <hr>
      <h3>Firebase Config</h3>
      <pre id="firebase-config" class="bg-light p-3" style="font-size: 11px;"></pre>
    </div>

    <script src="/__/firebase/10.12.0/firebase-app-compat.js"></script>
    <script src="/__/firebase/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/ui/6.1.0/firebase-ui-auth__ja.js"></script>
    <script src="/__/firebase/init.js?useEmulator=false"></script>
    <script>
     // Debug logging utility
     function log(message, type = 'info') {
       const logDiv = document.getElementById('debug-log');
       const timestamp = new Date().toLocaleTimeString();
       const span = document.createElement('span');
       span.className = type;
       span.textContent = `[${timestamp}] ${message}\n`;
       logDiv.appendChild(span);
       logDiv.scrollTop = logDiv.scrollHeight;
       console.log(`[${type.toUpperCase()}]`, message);
     }

     function clearDebugLog() {
       document.getElementById('debug-log').innerHTML = '';
     }

     function showError(error) {
       const errorDisplay = document.getElementById('error-display');
       const errorMessage = document.getElementById('error-message');
       errorDisplay.style.display = 'block';
       errorMessage.textContent = JSON.stringify(error, null, 2);
     }

     function checkAuthState() {
       const user = firebase.auth().currentUser;
       if (user) {
         log(`Current user: ${user.email} (${user.uid})`, 'success');
       } else {
         log('No user signed in', 'warn');
       }
     }

     // Show Firebase config (sanitized)
     try {
       const config = firebase.app().options;
       const sanitizedConfig = {
         projectId: config.projectId,
         authDomain: config.authDomain,
         storageBucket: config.storageBucket,
         // Don't show API key for security
         apiKey: config.apiKey ? '***' + config.apiKey.slice(-4) : 'N/A'
       };
       document.getElementById('firebase-config').textContent = JSON.stringify(sanitizedConfig, null, 2);
       log('Firebase initialized successfully', 'success');
       log(`Project: ${config.projectId}`, 'info');
       log(`Auth Domain: ${config.authDomain}`, 'info');
     } catch (e) {
       log('Firebase config error: ' + e.message, 'error');
     }

     // Check for redirect result first (important for redirect-based sign-in)
     log('Checking for redirect result...', 'info');
     firebase.auth().getRedirectResult()
       .then((result) => {
         if (result.user) {
           log(`Redirect sign-in successful: ${result.user.email}`, 'success');
           log(`User UID: ${result.user.uid}`, 'success');
           location.href = './index.html';
         } else {
           log('No redirect result (user may not have redirected)', 'info');
         }
       })
       .catch((error) => {
         log(`Redirect result error: ${error.code}`, 'error');
         log(`Error message: ${error.message}`, 'error');
         showError({
           code: error.code,
           message: error.message,
           email: error.email || 'N/A',
           credential: error.credential ? 'Present' : 'None'
         });
       });

     // Auth state observer
     log('Setting up auth state observer...', 'info');
     firebase.auth().onAuthStateChanged((user) => {
       if (user) {
         log(`Auth state changed: User signed in`, 'success');
         log(`Email: ${user.email}`, 'success');
         log(`UID: ${user.uid}`, 'success');
         log(`Provider: ${user.providerData.map(p => p.providerId).join(', ')}`, 'info');
         log('Redirecting to index.html...', 'info');
         location.href = './index.html';
       } else {
         log('Auth state changed: No user', 'info');
       }
     });

     // FirebaseUI config with callbacks
     const uiConfig = {
       signInSuccessUrl: '/index.html',
       signInFlow: 'popup',  // redirect の代わりに popup を使用（サードパーティCookie制限対策）
       signInOptions: [
         {
           provider: firebase.auth.GoogleAuthProvider.PROVIDER_ID,
           customParameters: {
             prompt: 'select_account'
           }
         }
       ],
       tosUrl: null,
       privacyPolicyUrl: null,

       // Callbacks for debugging
       callbacks: {
         signInSuccessWithAuthResult: function(authResult, redirectUrl) {
           log('signInSuccessWithAuthResult called', 'success');
           log(`User: ${authResult.user.email}`, 'success');
           log(`Is new user: ${authResult.additionalUserInfo?.isNewUser}`, 'info');
           log(`Redirect URL: ${redirectUrl}`, 'info');
           // Return true to continue redirect, false to handle manually
           return true;
         },
         signInFailure: function(error) {
           log(`signInFailure: ${error.code}`, 'error');
           log(`Error message: ${error.message}`, 'error');
           showError({
             code: error.code,
             message: error.message,
             email: error.email || 'N/A'
           });
           // Return a promise to handle the error
           return Promise.resolve();
         },
         uiShown: function() {
           log('FirebaseUI widget rendered', 'info');
         }
       }
     };

     log('Initializing FirebaseUI...', 'info');
     const ui = new firebaseui.auth.AuthUI(firebase.auth());
     ui.start('#firebaseui-auth-container', uiConfig);
     log('FirebaseUI started', 'success');
    </script>
  </body>
</html>
