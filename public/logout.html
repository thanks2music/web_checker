<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ログアウト - WEB CHECKER</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
  </head>

  <body>
    <div class="container mt-5">
      <h1>ログアウト</h1>
      <p id="status">ログアウト処理中...</p>
      <a href="login.html" class="btn btn-primary" id="login-link" style="display: none;">ログインページへ</a>
    </div>

    <script src="/__/firebase/10.12.0/firebase-app-compat.js"></script>
    <script src="/__/firebase/10.12.0/firebase-auth-compat.js"></script>
    <script src="/__/firebase/init.js?useEmulator=false"></script>
    <script>
     firebase.auth().signOut()
       .then(() => {
         document.getElementById('status').textContent = 'ログアウトしました。';
         document.getElementById('login-link').style.display = 'inline-block';
         // 3秒後にログインページへリダイレクト
         setTimeout(() => {
           location.href = './login.html';
         }, 3000);
       })
       .catch((error) => {
         console.error('ログアウト時にエラーが発生しました:', error);
         document.getElementById('status').textContent = 'ログアウトに失敗しました。';
         document.getElementById('login-link').style.display = 'inline-block';
       });
    </script>
  </body>
</html>
