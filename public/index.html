<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WEB CHECKER</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
  </head>

  <body>
    <div class="container">
      <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="#">WEB CHECKER</a>
        <div class="collapse navbar-collapse justify-content-end" id="navbarSupportedContent">
          <ul class="nav">
            <li class="nav-item"><a href="logout.html">ログアウト</a></li>
          </ul>
        </div>
      </nav>

      <div id="not-approved" class="alert alert-warning" style="display: none;">
        アカウントが承認されていません。管理者にお問い合わせください。
      </div>

      <h1>スケジュール一覧</h1>

      <table class="table table-sm">
        <thead>
          <tr>
            <th>スケジュール</th>
            <th>タイトル</th>
            <th>URL</th>
            <th>セレクタ</th>
            <th>通知先</th>
            <th>編集</th>
            <th>詳細</th>
          </tr>
        </thead>

        <tbody id="create">
          <tr>
            <td><input type="text" class="form-control schedule" placeholder="0 * * * *" value="0 * * * *"><small class="form-text text-muted"><a href="https://crontab.guru" target="_blank" rel="noopener noreferrer">crontab 形式</a>。分は無視されます。</small></td>
            <td><input type="text" class="form-control title"></td>
            <td><input type="text" class="form-control uri" placeholder="https://" value="https://"></td>
            <td><input type="text" class="form-control selector" placeholder="#hoge, .bar:nth-child(3)"><small class="form-text text-muted">CSS3 Selector 形式。</small></td>
            <td><input type="text" class="form-control slack" placeholder="#slack"><small class="form-text text-muted">Slack の通知先チャネル名。空白可</small></td>
            <td><button id="create-button" class="btn btn-primary">新規追加</button></td>
          </tr>
        </tbody>

        <tbody id="records">
        </tbody>
      </table>
    </div>

    <div id="loading" class="text-center" style="display: none; position: absolute; left: 50%; top: 30%;">
      <div class="spinner-border" role="status">
        <span class="sr-only">Loading...</span>
      </div>
    </div>

    <script src="/__/firebase/10.12.0/firebase-app-compat.js"></script>
    <script src="/__/firebase/10.12.0/firebase-auth-compat.js"></script>
    <script src="/__/firebase/10.12.0/firebase-firestore-compat.js"></script>
    <script src="/__/firebase/init.js?useEmulator=false"></script>
    <script src="./javascripts/routing.js"></script>
    <script>
     // XSS 対策: HTML エスケープ関数
     function escapeHtml(text) {
       if (text === null || text === undefined) return '';
       const div = document.createElement('div');
       div.textContent = text;
       return div.innerHTML;
     }

     const db = firebase.firestore();
     let currentUser = null;

     // 認証状態の確認と approved チェック
     firebase.auth().onAuthStateChanged(async (user) => {
       if (!user) {
         location.href = './login.html';
         return;
       }

       currentUser = user;

       // カスタムクレームをチェック
       const idTokenResult = await user.getIdTokenResult();
       if (!idTokenResult.claims.approved) {
         $('#not-approved').show();
         $('#create').hide();
         $('#loading').hide();
         return;
       }

       loadSchedules();
     });

     function loadSchedules() {
       $('#loading').fadeIn(0);
       db.collection('schedules').orderBy('createdAt', 'desc').get().then(doc => {
         doc.forEach(schedule => {
           const id = schedule.id;
           const data = schedule.data();

           // XSS 対策: すべての値をエスケープ
           const safeSchedule = escapeHtml(data.schedule);
           const safeTitle = escapeHtml(data.title);
           const safeUri = escapeHtml(data.uri);
           const safeSelector = escapeHtml(data.selector);
           const safeSlack = escapeHtml(data.slack || '');
           const safeId = escapeHtml(id);
           const checkedAtStr = data.checkedAt ? new Date(data.checkedAt).toLocaleString() : '-';

           const scheduleDom = $(`
<tr id="${safeId}">
  <td rowspan="2"><input type="text" class="form-control schedule" readonly="readonly" value="${safeSchedule}" data-value="${safeSchedule}">
  <td rowspan="2"><input type="text" class="form-control title"    readonly="readonly" value="${safeTitle}"    data-value="${safeTitle}"></td>
  <td rowspan="2"><input type="text" class="form-control uri"      readonly="readonly" value="${safeUri}"      data-value="${safeUri}"></td>
  <td rowspan="2"><input type="text" class="form-control selector" readonly="readonly" value="${safeSelector}" data-value="${safeSelector}"></td>
  <td rowspan="2"><input type="text" class="form-control slack"    readonly="readonly" value="${safeSlack}"    data-value="${safeSlack}"></td>
  <td><button id="edit-${safeId}"   class="edit   btn btn-primary" data-id="${safeId}">編集</button>
      <button id="save-${safeId}"   class="save   btn btn-primary" data-id="${safeId}">保存</button>
      <button id="cancel-${safeId}" class="cancel btn btn-light"   data-id="${safeId}">x</button>
      <button id="delete-${safeId}" class="delete btn btn-danger"  data-id="${safeId}">削除</button></td>
  <td><a href="./detail.html?scheduleId=${safeId}" class="btn btn-link" role="button">履歴</a></td>
</tr>
<tr>
  <td colspan="2" class="text-right"><small class="form-text text-muted">最終チェック日時: ${escapeHtml(checkedAtStr)}</small></td>
</tr>
           `);
           $('#records').append(scheduleDom);
           $('.save').hide();
           $('.cancel').hide();

           $(`#edit-${id}`).on('click', (event) => {
             $(`#${id} input`).prop('readonly', false);
             $(`.edit:not(#edit-${id})`).prop('disabled', true);
             $(`#edit-${id}`).hide();
             $(`#save-${id}`).show();
             $('.delete').hide();
             $(`#cancel-${id}`).show();
           });

           $(`#save-${id}`).on('click', (event) => {
             $('#loading').show().fadeIn();

             db.collection('schedules').doc(id).set({
               schedule: $(`#${id} .schedule`).val(),
               uri: $(`#${id} .uri`).val(),
               title: $(`#${id} .title`).val(),
               selector: $(`#${id} .selector`).val(),
               slack: $(`#${id} .slack`).val(),
               updatedUser: currentUser.email,
             }, { merge: true }).then(() => {
               $(`#${id} .schedule`).data('value', $(`#${id} .schedule`).val());
               $(`#${id} .title`).data('value', $(`#${id} .title`).val());
               $(`#${id} .uri`).data('value', $(`#${id} .uri`).val());
               $(`#${id} .selector`).data('value', $(`#${id} .selector`).val());
               $(`#${id} .slack`).data('value', $(`#${id} .slack`).val());

               $(`#${id} input`).prop('readonly', true);
               $(`button.edit`).prop('disabled', false);
               $(`#save-${id}`).hide();
               $(`#edit-${id}`).show();
               $('.delete').show();
               $(`#cancel-${id}`).hide();

               $('#loading').fadeOut(0);
             }).catch(err => {
               console.error(err);
               alert('保存に失敗しました: ' + err.message);
               $('#loading').fadeOut(0);
             });
           });

           $(`#cancel-${id}`).on('click', (event) => {
             $(`#${id} input`).prop('readonly', true)
                              .each((i, dom) => { $(dom).val($(dom).data('value')); });
             $(`button.edit`).prop('disabled', false);
             $(`#save-${id}`).hide();
             $(`#edit-${id}`).show();
             $('.delete').show();
             $(`#cancel-${id}`).hide();
           });

           $(`#delete-${id}`).on('click', (event) => {
             if(!confirm('本当に削除しますか？')) { return; }

             $('#loading').show().fadeIn();
             db.collection('schedules').doc(id).delete().then(() => {
               $('#loading').fadeOut(0);
               alert('削除されました');
               $(`#${id}`).remove();
             }).catch(err => {
               console.error(err);
               alert('削除に失敗しました: ' + err.message);
               $('#loading').fadeOut(0);
             });
           });
         });

         $('#loading').fadeOut();
       }).catch(err => {
         console.error(err);
         alert('データの取得に失敗しました: ' + err.message);
         $('#loading').fadeOut();
       });

       $(`#create-button`).on('click', (event) => {
         $('#loading').show().fadeIn();

         const _schedule = $('#create .schedule').val();
         const _uri = $('#create .uri').val();
         const _title = $('#create .title').val();
         const _selector = $('#create .selector').val();
         const _slack = $('#create .slack').val() || '';

         if(!(_schedule.match(/^.*\s.*\s.*\s.*\s.*$/) && _title && _uri.match(/^http(s)?:\/\/.+$/) && _selector)) {
           $('#loading').fadeOut();
           alert('すべての項目を入力してください');
           return;
         }

         db.collection('schedules').add({
           schedule: _schedule,
           uri: _uri,
           title: _title,
           selector: _selector,
           slack: _slack,
           createdUser: currentUser.email,
           createdAt: Date.now(),
           checkedAt: Date.now()
         }).then(() => {
           location.href = 'index.html';
         }).catch(err => {
           console.error(err);
           alert('追加に失敗しました: ' + err.message);
           $('#loading').fadeOut();
         });
       });
     }
    </script>
  </body>
</html>
